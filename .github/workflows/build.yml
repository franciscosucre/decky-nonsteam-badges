name: Build and Release Non-Steam Badges

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@9.0.0 --activate

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build and package plugin
        run: bash scripts/build-plugin-zip.sh .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: decky-nonsteam-badges
          path: decky-nonsteam-badges.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: decky-nonsteam-badges
          path: .

      - name: Create TAR release
        run: |
          mkdir -p release
          unzip -q decky-nonsteam-badges.zip -d release
          tar -czvf decky-nonsteam-badges.tar.gz -C release decky-nonsteam-badges

      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "decky-nonsteam-badges.zip,decky-nonsteam-badges.tar.gz"
          allowUpdates: true
          replacesArtifacts: true
